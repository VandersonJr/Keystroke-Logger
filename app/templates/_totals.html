<div class="grid">
  <div class="card"><strong>Total de eventos</strong><div style="font-size:28px">{{ totals.total }}</div></div>
  <div class="card"><strong>Por categoria</strong>
    <table>{% for r in totals.by_category %}<tr><td>{{ r.name }}</td><td>{{ r.n }}</td></tr>{% else %}<tr><td class="muted">Sem dados</td></tr>{% endfor %}</table></div>
  <div class="card"><strong>Por contexto</strong>
    <table>{% for r in totals.by_context %}<tr><td>{{ r.name }}</td><td>{{ r.n }}</td></tr>{% else %}<tr><td class="muted">Sem dados</td></tr>{% endfor %}</table></div>
</div>
